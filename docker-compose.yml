# ==============================================================================
# 🚀 NOSS Linux Malaysia (DSOM) - Multi-Web Server Docker Compose
# ==============================================================================
# Cara Penggunaan:
# 1. Jalankan Nginx (Lalai pada port 8080):
#    docker compose up -d nginx
#
# 2. Jalankan Apache HTTP Server (pada port 8081):
#    docker compose up -d apache
#
# 3. Jalankan kedua-duanya sekali gus:
#    docker compose up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Nginx Production Web Server (Lalai)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: noss-linux-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - noss-network

  # ----------------------------------------------------------------------------
  # 2. Apache HTTP Server (httpd)
  # ----------------------------------------------------------------------------
  apache:
    image: httpd:alpine
    container_name: noss-linux-apache
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./html:/usr/local/apache2/htdocs:ro
      - ./deploy/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - noss-network

networks:
  noss-network:
    name: noss-linux-net
    driver: bridge
