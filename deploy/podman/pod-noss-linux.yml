# ==============================================================================
# 🦭 Podman Pod Definition (Kubernetes YAML Format for Podman Play Kube)
# ==============================================================================
# Cara Penggunaan:
# 1. Jalankan Pod menggunakan Podman:
#    podman play kube deploy/podman/pod-noss-linux.yml
#
# 2. Hentikan / Buang Pod:
#    podman play kube --down deploy/podman/pod-noss-linux.yml
# ==============================================================================

apiVersion: v1
kind: Pod
metadata:
  name: noss-linux-pod
  labels:
    app: noss-linux-docs
spec:
  containers:
    # --------------------------------------------------------------------------
    # 1. Nginx Container (Port 8080)
    # --------------------------------------------------------------------------
    - name: noss-nginx
      image: docker.io/library/nginx:alpine
      ports:
        - containerPort: 80
          hostPort: 8080
          protocol: TCP
      volumeMounts:
        - name: html-storage
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          readOnly: true

    # --------------------------------------------------------------------------
    # 2. Apache HTTPD Container (Port 8081)
    # --------------------------------------------------------------------------
    - name: noss-apache
      image: docker.io/library/httpd:alpine
      ports:
        - containerPort: 80
          hostPort: 8081
          protocol: TCP
      volumeMounts:
        - name: html-storage
          mountPath: /usr/local/apache2/htdocs
          readOnly: true
        - name: apache-config
          mountPath: /usr/local/apache2/conf/httpd.conf
          readOnly: true

  volumes:
    - name: html-storage
      hostPath:
        path: ./html
        type: Directory
    - name: nginx-config
      hostPath:
        path: ./deploy/nginx/nginx.conf
        type: File
    - name: apache-config
      hostPath:
        path: ./deploy/apache/httpd.conf
        type: File
