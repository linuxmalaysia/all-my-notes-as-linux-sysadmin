# ==============================================================================
# 🎯 NOSS Linux Deployment Inventory
# ==============================================================================

[local]
localhost ansible_connection=local

[ubuntu_servers]
# ubuntu-node1 ansible_host=192.168.1.100 ansible_user=ubuntu

[rhel_servers]
# almalinux-node1 ansible_host=192.168.1.101 ansible_user=almalinux
# fedora-node1    ansible_host=192.168.1.102 ansible_user=fedora

[all:vars]
ansible_python_interpreter=/usr/bin/python3
site_name=noss-linux
http_port=8080
deploy_target_dir=/var/www/skills-noss
