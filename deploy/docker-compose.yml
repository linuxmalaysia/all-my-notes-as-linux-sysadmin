# ==============================================================================
# 🚀 NOSS Linux Malaysia (DSOM) - Multi-Web Server Docker Compose
# ==============================================================================
# Cara Penggunaan dari folder deploy/:
#    docker compose -f deploy/docker-compose.yml up -d
# ==============================================================================

services:
  nginx:
    image: nginx:alpine
    container_name: noss-linux-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - noss-network

  apache:
    image: httpd:alpine
    container_name: noss-linux-apache
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ../html:/usr/local/apache2/htdocs:ro
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      - noss-network

networks:
  noss-network:
    name: noss-linux-net
    driver: bridge
